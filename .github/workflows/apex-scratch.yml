# VR-1.3 — the Apex compile-the-output loop (deploy validate). This is the Apex
# equivalent of the Go `go build` gate: it generates the Apex SDK and
# check-only-deploys it, so the platform compiler is the oracle.
#
# Each run creates a one-day scratch org from the Dev Hub that SFDX_AUTH_URL
# authorizes, deploys the generated SDK into it, runs the SDK's Apex tests
# there, and deletes the org when done (always, even on failure). The Dev Hub
# itself is never deployed to. Runs are serialized (one `apex-dev-hub` group,
# shared with the live smoke) so they stay inside the Dev Hub's active
# scratch-org cap (3) and its daily signup cap, and a run never overlaps the
# live smoke. Manual (workflow_dispatch); the auth comes from a repo secret,
# never the repository. Without the secret the job skips, so a dry run still
# passes.
#
# Before creating anything the job checks that the org it logged into is the
# one in the APEX_DEVHUB_ORG_ID repo variable, so a stale secret can't spend
# scratch orgs on the wrong Dev Hub. The check prints only match or mismatch:
# these logs are public.
#
# Set up: get the target org's Sfdx Auth Url —
#   sf org display --verbose --target-org <org>   # copy "Sfdx Auth Url"
# and store it as the SFDX_AUTH_URL repo secret; store that org's Id (the
# "Id" field, 00D...) as the APEX_DEVHUB_ORG_ID repo variable.
name: Apex scratch-org validate (VR-1.3)

on:
  workflow_dispatch:

# Not cancelled: a queued run waits for the one in flight, whose scratch org
# its cleanup step still has to delete.
concurrency:
  group: apex-dev-hub
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
      EXPECTED_DEVHUB_ORG_ID: ${{ vars.APEX_DEVHUB_ORG_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Guard — a target org is required
        id: guard
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::notice::No SFDX_AUTH_URL secret; skipping the deploy validate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          # The Salesforce CLI's bundled undici needs Node >= 22
          # (webidl.util.markAsUncloneable); Node 20 crashes on first callout.
          node-version: '22'
      - if: steps.guard.outputs.skip != 'true'
        name: Install the Salesforce CLI
        # Pinned to the v2 major so the job's behaviour can't silently drift on a
        # new major release.
        run: npm install --global @salesforce/cli@2
      - if: steps.guard.outputs.skip != 'true'
        name: Generate the Apex SDK (a deployable SFDX project)
        run: >
          cargo run -p gantry-cli -- generate --target apex --out apex-sdk
          fixtures/specs/openapi.json
          fixtures/specs/openapi-v2025.0.json
          fixtures/specs/openapi-v2026.0.json
      - if: steps.guard.outputs.skip != 'true'
        name: Log in to the Dev Hub and check it is the expected one
        run: |
          set -euo pipefail
          # Through a file: the CLI's stdin flag takes an optional value and
          # mis-parses the flags that follow it.
          url_file="$RUNNER_TEMP/devhub_auth_url"
          (umask 077; printf '%s' "$SFDX_AUTH_URL" > "$url_file")
          sf org login sfdx-url --sfdx-url-file "$url_file" --alias devhub --set-default-dev-hub
          rm -f "$url_file"
          if [ -z "$EXPECTED_DEVHUB_ORG_ID" ]; then
            echo "::error::The APEX_DEVHUB_ORG_ID repo variable is not set; no scratch org created."
            exit 1
          fi
          actual=$(sf org display --target-org devhub --json | jq -r '.result.id')
          if [ "${actual:0:15}" != "${EXPECTED_DEVHUB_ORG_ID:0:15}" ]; then
            echo "::error::SFDX_AUTH_URL authorizes a different org than APEX_DEVHUB_ORG_ID; no scratch org created."
            exit 1
          fi
          echo "Dev Hub matches APEX_DEVHUB_ORG_ID."
      - if: steps.guard.outputs.skip != 'true'
        id: create
        name: Create a one-day scratch org
        working-directory: apex-sdk
        run: |
          set -euo pipefail
          sf org create scratch --target-dev-hub devhub \
            --definition-file config/project-scratch-def.json \
            --alias scratch --duration-days 1 --wait 20 --no-track-source
      - if: steps.guard.outputs.skip != 'true'
        name: Deploy and test in the scratch org
        working-directory: apex-sdk
        run: |
          set -euo pipefail
          # Deploy the SDK and run its own Apex tests — the runtime's
          # HttpCalloutMock suites included. RunSpecifiedTests names the SDK's
          # test classes (the scratch org holds nothing else). The deploy exit
          # code is judged by the result counts below, as before.
          mapfile -t tests < <(grep -li '^@isTest' force-app/main/default/classes/*.cls \
            | xargs -n1 basename | sed 's/\.cls$//')
          echo "Running ${#tests[@]} Apex test classes"
          sf project deploy start --test-level RunSpecifiedTests --tests "${tests[@]}" \
            --wait 30 --ignore-conflicts --target-org scratch --json > deploy.json || true
          component_errors=$(jq '.result.numberComponentErrors // -1' deploy.json)
          tests_run=$(jq '.result.details.runTestResult.numTestsRun // 0' deploy.json)
          test_failures=$(jq '.result.details.runTestResult.numFailures // -1' deploy.json)
          echo "Components failed: $component_errors; tests run: $tests_run, failed: $test_failures"
          if [ "$component_errors" -ne 0 ] || [ "$test_failures" -ne 0 ] || [ "$tests_run" -eq 0 ]; then
            # Name each compile and test failure.
            jq -r '((.result.details.componentFailures // [] | if type == "array" then . else [.] end)[]
                     | "component \(.fullName): \(.problem)"),
                   ((.result.details.runTestResult.failures // [] | if type == "array" then . else [.] end)[]
                     | "test \(.name).\(.methodName): \(.message)"),
                   (.message // empty)' deploy.json || head -c 6000 deploy.json
            exit 1
          fi
      # Always, so a failed deploy doesn't leave an org counting against the
      # Dev Hub's active cap (it would also expire on its own after a day).
      - if: ${{ always() && steps.guard.outputs.skip != 'true' && steps.create.outcome != 'skipped' }}
        name: Delete the scratch org
        run: sf org delete scratch --target-org scratch --no-prompt
