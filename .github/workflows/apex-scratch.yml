# VR-1.3 — the Apex compile-the-output loop (scratch-org deploy validate).
# This is the Apex equivalent of the Go `go build` gate: it generates the
# Apex SDK and check-only-deploys it to a fresh scratch org, so the platform
# compiler is the oracle. It needs a Salesforce Dev Hub, so it is manual
# (workflow_dispatch); the Dev Hub auth comes from a repo secret, never the
# repository. Without the secret the job skips, so a dry run still passes.
#
# Set up: create a Dev Hub, then
#   sf org login web --set-default-dev-hub
#   sf org display --verbose --target-org <devhub>   # copy the Sfdx Auth Url
# and store that URL as the SFDX_AUTH_URL repo secret.
name: Apex scratch-org validate (VR-1.3)

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard — a Dev Hub is required
        id: guard
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::notice::No SFDX_AUTH_URL secret; skipping the scratch-org validate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          # The Salesforce CLI's bundled undici needs Node >= 22
          # (webidl.util.markAsUncloneable); Node 20 crashes on first callout.
          node-version: '22'
      - if: steps.guard.outputs.skip != 'true'
        name: Install the Salesforce CLI
        run: npm install --global @salesforce/cli
      - if: steps.guard.outputs.skip != 'true'
        name: Generate the Apex SDK (a deployable SFDX project)
        run: >
          cargo run -p gantry-cli -- generate --target apex --out apex-sdk
          fixtures/specs/openapi.json
          fixtures/specs/openapi-v2025.0.json
          fixtures/specs/openapi-v2026.0.json
      - if: steps.guard.outputs.skip != 'true'
        name: Deploy-validate against a fresh scratch org
        working-directory: apex-sdk
        run: |
          set -euo pipefail
          printf '%s' "$SFDX_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin --set-default-dev-hub --alias devhub
          mkdir -p config
          cat > config/project-scratch-def.json <<'JSON'
          { "orgName": "box-gantry", "edition": "Developer" }
          JSON
          sf org create scratch --target-dev-hub devhub \
            --definition-file config/project-scratch-def.json \
            --alias validate-org --set-default --duration-days 1 --wait 20
          # Check-only deploy: the platform compiles every class; nothing is
          # persisted. This is the VR-1.3 signal.
          sf project deploy start --check-only --wait 30 --ignore-conflicts
      - if: always() && steps.guard.outputs.skip != 'true'
        name: Delete the scratch org
        working-directory: apex-sdk
        run: sf org delete scratch --no-prompt --target-org validate-org || true
