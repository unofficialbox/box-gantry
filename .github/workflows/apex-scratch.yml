# VR-1.3 — the Apex compile-the-output loop (deploy validate). This is the Apex
# equivalent of the Go `go build` gate: it generates the Apex SDK and
# check-only-deploys it, so the platform compiler is the oracle.
#
# It deploys against the org that SFDX_AUTH_URL authorizes (the Dev Hub) with
# `--dry-run`, so the platform compiles every class but nothing is persisted —
# and no scratch org is created, so the Dev Hub's daily scratch-org signup limit
# is never a factor. Manual (workflow_dispatch); the auth comes from a repo
# secret, never the repository. Without the secret the job skips, so a dry run
# still passes.
#
# Set up: get the target org's Sfdx Auth Url —
#   sf org display --verbose --target-org <org>   # copy "Sfdx Auth Url"
# and store it as the SFDX_AUTH_URL repo secret.
name: Apex scratch-org validate (VR-1.3)

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard — a target org is required
        id: guard
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::notice::No SFDX_AUTH_URL secret; skipping the deploy validate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          # The Salesforce CLI's bundled undici needs Node >= 22
          # (webidl.util.markAsUncloneable); Node 20 crashes on first callout.
          node-version: '22'
      - if: steps.guard.outputs.skip != 'true'
        name: Install the Salesforce CLI
        # Pinned to the v2 major so the job's behaviour can't silently drift on a
        # new major release.
        run: npm install --global @salesforce/cli@2
      - if: steps.guard.outputs.skip != 'true'
        name: Generate the Apex SDK (a deployable SFDX project)
        run: >
          cargo run -p gantry-cli -- generate --target apex --out apex-sdk
          fixtures/specs/openapi.json
          fixtures/specs/openapi-v2025.0.json
          fixtures/specs/openapi-v2026.0.json
      - if: steps.guard.outputs.skip != 'true'
        name: Deploy-validate against the configured org (check-only, nothing persists)
        working-directory: apex-sdk
        run: |
          set -euo pipefail
          printf '%s' "$SFDX_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin --set-default --alias target
          # Validate-only deploy (--dry-run): the platform compiles every class;
          # nothing is persisted. This is the VR-1.3 signal.
          sf project deploy start --dry-run --wait 30 --ignore-conflicts --target-org target
