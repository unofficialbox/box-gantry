# The primary CI signal (PLAN.md, verification cadence). The toolchain is
# pinned by rust-toolchain.toml (NF-6); rustup respects it automatically.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # TR-Go.4 floor; the contract stub gate (FR-5.3) compiles real Go.
          go-version: '1.23'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Check the real Box specs (ingestion must be loud-clean)
        run: >
          cargo run -p gantry-cli -- check
          fixtures/specs/openapi.json
          fixtures/specs/openapi-v2025.0.json
          fixtures/specs/openapi-v2026.0.json
      - name: Verify generated Go compiles (VR-1.1, the primary signal)
        run: >
          cargo run -p gantry-cli -- verify
          fixtures/specs/openapi.json
          fixtures/specs/openapi-v2025.0.json
          fixtures/specs/openapi-v2026.0.json
          --target go
      - name: Verify generated Rust compiles (VR-1.2 — rustfmt + cargo check + clippy)
        run: >
          cargo run -p gantry-cli -- verify
          fixtures/specs/openapi.json
          fixtures/specs/openapi-v2025.0.json
          fixtures/specs/openapi-v2026.0.json
          --target rust
      - name: Conformance checklist — Go (VR-3, the R§1 capability contract)
        run: >
          cargo run -p gantry-cli -- conform
          fixtures/specs/openapi.json
          fixtures/specs/openapi-v2025.0.json
          fixtures/specs/openapi-v2026.0.json
          --target go
      - name: Conformance checklist — Apex (VR-3; parity minus documented exclusions)
        run: >
          cargo run -p gantry-cli -- conform
          fixtures/specs/openapi.json
          fixtures/specs/openapi-v2025.0.json
          fixtures/specs/openapi-v2026.0.json
          --target apex
      - name: Conformance checklist — Rust (VR-3; full capability parity)
        run: >
          cargo run -p gantry-cli -- conform
          fixtures/specs/openapi.json
          fixtures/specs/openapi-v2025.0.json
          fixtures/specs/openapi-v2026.0.json
          --target rust
      - name: Build and test the hand-written Go runtime (TR-Go.7)
        working-directory: runtimes/go
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...
      - name: Build and test the hand-written Rust runtime (TR-Rust.5)
        working-directory: runtimes/rust/gantryruntime
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
