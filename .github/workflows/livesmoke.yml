# VR-7 live smoke (release-blocking, on demand). NOT part of the per-commit
# gate: it needs real Box credentials and touches a live account, so it is
# manual (workflow_dispatch). Credentials come from repo secrets — never
# from the repository. Absent secrets → the test t.Skip()s, so a dry run
# still passes.
name: Live smoke (VR-7)

on:
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    env:
      # Map secrets to env here: the `secrets` context is available in `env`
      # but not in step `if:` conditions, so gate the steps on these.
      BOX_DEVELOPER_TOKEN: ${{ secrets.BOX_DEVELOPER_TOKEN }}
      BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID }}
      BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET }}
      BOX_ENTERPRISE_ID: ${{ secrets.BOX_ENTERPRISE_ID }}
      BOX_OAUTH_REFRESH_TOKEN: ${{ secrets.BOX_OAUTH_REFRESH_TOKEN }}
      BOX_JWT_CONFIG_JSON: ${{ secrets.BOX_JWT_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          # The Java live smoke compiles + runs the generated VR-7 driver against
          # the real runtime under the ship target — Java 26 (Corretto), matching
          # ci.yml's VR-1.6 gate. The runtime uses HTTP/3 (D-180), so 26 is the
          # floor.
          distribution: corretto
          java-version: '26'
      - name: Install TypeScript 7 (to build the TS live smoke)
        run: npm install -g typescript@7.0.2
      - name: Write the JWT config, if provided
        if: ${{ env.BOX_JWT_CONFIG_JSON != '' }}
        run: |
          printf '%s' "$BOX_JWT_CONFIG_JSON" > "$RUNNER_TEMP/box_config.json"
          echo "BOX_JWT_CONFIG=$RUNNER_TEMP/box_config.json" >> "$GITHUB_ENV"
      - name: Run the Go live smoke (one call per auth flow + upload/download/paginate)
        working-directory: runtimes/go
        run: go test -tags live -run TestLiveSmoke -v ./gantryruntime/...
      - name: Run the Rust live smoke (same flows, the hand-written reqwest/tokio runtime)
        working-directory: runtimes/rust/gantryruntime
        # The OAuth refresh token rotates on use, so the Go step above already
        # consumed it — null it here so the Rust smoke skips OAuth rather than
        # failing on a stale token. Go covers the shared OAuth flow; Rust covers
        # developer/CCG/JWT live (its OAuth path is unit-tested and shares the
        # CCG flow's cached-refresh machinery, which the smoke does exercise).
        env:
          BOX_OAUTH_REFRESH_TOKEN: ""
        run: cargo test --test livesmoke -- --ignored --nocapture
      - name: Run the TypeScript live smoke (same flows, the hand-written fetch runtime)
        working-directory: runtimes/typescript/gantryruntime
        # Node's strip-only TS mode can't run the runtime's NodeNext `.js`
        # specifiers or parameter-property classes, so build to JS first, then
        # run the built smoke. OAuth's refresh token rotates on use and the Go
        # step above already consumed it — null it so the TS smoke skips OAuth
        # rather than failing on a stale token (Go covers the shared OAuth flow;
        # TS covers developer/CCG/JWT live, its OAuth path sharing the CCG
        # cached-refresh machinery the smoke does exercise).
        env:
          BOX_OAUTH_REFRESH_TOKEN: ""
        run: |
          tsc -p tsconfig.livesmoke.json
          node --test dist-livesmoke/livesmoke.test.js
      - name: Run the Java live smoke (same flows, the hand-written java.net.http runtime)
        # The VR-7 driver (D-175/D-181) compiles against the real runtime and
        # runs one authenticated `GET /users/me` per credentialed flow; the gate
        # skips the run (compiles only) when no BOX_* creds are set. Rust honors
        # rust-toolchain.toml automatically. OAuth's refresh token rotates on use
        # and the Go step above already consumed it — null it so the Java smoke
        # skips OAuth rather than failing on a stale token (Go covers the shared
        # OAuth flow; Java covers developer/CCG/JWT live, its OAuth path sharing
        # the CCG cached-refresh machinery the smoke does exercise).
        env:
          BOX_OAUTH_REFRESH_TOKEN: ""
        run: >
          cargo test -p gantry-backend-java --test runtime
          the_live_smoke_compiles_and_runs_when_credentialed -- --nocapture
